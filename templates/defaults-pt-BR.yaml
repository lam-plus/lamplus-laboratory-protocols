# Run from the repository root. Add the protocol directory to resource-path
# for equipment documents; paths are resolved from the working directory.
from: markdown
to: latex
standalone: true
pdf-engine: xelatex
template: templates/pdf-template.tex
table-of-contents: true
toc-depth: 2
number-sections: true
syntax-highlighting: none
resource-path:
  - .
  - templates
metadata:
  lang: pt-BR
variables:
  tex-language: portuguese
  toc-title: Sumário
  protocol-label: Protocolo
  version-label: Versão
  language-label: Idioma
  status-label: Status
